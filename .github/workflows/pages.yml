name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"   # rebuild with fresh exchange data every 30 minutes
  workflow_dispatch:

permissions:
  contents: write        # push APR history / posted-state to the `data` branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # APR history + Telegram state live on the `data` branch (created on first run)
      - name: Get data branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: data
          path: data

      # OKX / Bybit data relayed from an EU machine (US runners get no answer from them)
      - name: Get relay branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: relay
          path: relay

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # design-system guard: no text below 12px, no raw hex colours or arbitrary radii in components (fails the build)
      - name: UI audit
        run: node scripts/audit-ui.mjs

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "1"
          NEXT_PUBLIC_SITE_DOMAIN: ${{ github.repository_owner }}.github.io/promoradar
          NEXT_TELEMETRY_DISABLED: "1"
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}   # promo texts → uk/ru (DeepL API Free); empty = originals shown
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}         # second free translator (Azure F0, 2M chars/month)
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}   # e.g. westeurope (the resource's region)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # AI-written FAQ on promo pages (src/lib/faq.ts); empty = no FAQ
          FAQ_MODEL: ${{ vars.FAQ_MODEL || 'claude-opus-5-5' }}
          VALUE_MODEL: ${{ vars.VALUE_MODEL || 'claude-sonnet-5-5' }}   # reads each promo's rules once → expected $ per person, junk filter (src/lib/value.ts)

      # report only: broken text on pages, promo logic, untranslated uk/ru titles (warnings on the run, never blocks a deploy)
      - name: Content audit
        run: node scripts/audit-content.mjs
        continue-on-error: true

      - name: Friendly 404 (old addresses redirect)
        run: node scripts/page-404.mjs

      - name: Share cards (og:image) for promo pages
        run: node scripts/og-cards.mjs
        continue-on-error: true

      - name: Record APR snapshot
        run: node scripts/snapshot.mjs

      - name: Post to Telegram
        run: node scripts/telegram-post.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/promoradar
          POST_LANG: ${{ vars.POST_LANG || 'uk' }}

      - name: Save data branch
        working-directory: data
        run: |
          if [ ! -d .git ]; then
            git init -q -b data
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          fi
          git config user.name "promoradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data: $(date -u +%FT%TZ)" || exit 0
          git push -q origin HEAD:data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
