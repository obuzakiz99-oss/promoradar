name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"   # rebuild with fresh exchange data every 30 minutes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # push APR history / posted-state to the `data` branch
    timeout-minutes: 25
    env:
      SITE_HOST: ${{ vars.SITE_HOST }}   # own domain (e.g. promoradar.xyz); empty = github.io/promoradar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # APR history + Telegram state live on the `data` branch (created on first run)
      - name: Get data branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        continue-on-error: true
        with:
          ref: data
          path: data

      # OKX / Bybit data relayed from an EU machine (US runners get no answer from them)
      - name: Get relay branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        continue-on-error: true
        with:
          ref: relay
          path: relay

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # design-system guard: no text below 12px, no raw hex colours or arbitrary radii in components (fails the build)
      - name: UI audit
        run: node scripts/audit-ui.mjs

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "1"
          NEXT_PUBLIC_SITE_DOMAIN: ${{ vars.SITE_HOST || format('{0}.github.io/promoradar', github.repository_owner) }}
          NEXT_TELEMETRY_DISABLED: "1"
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}   # promo texts → uk/ru (DeepL API Free); empty = originals shown
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}         # second free translator (Azure F0, 2M chars/month)
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}   # e.g. westeurope (the resource's region)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # AI-written FAQ on promo pages (src/lib/faq.ts); empty = no FAQ
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # free Gemini tier (aistudio.google.com): translations + reading promo rules when there is no Claude key
          FAQ_MODEL: ${{ vars.FAQ_MODEL || 'claude-opus-5-5' }}
          VALUE_MODEL: ${{ vars.VALUE_MODEL || 'claude-sonnet-5-5' }}   # reads each promo's rules once → expected $ per person, junk filter (src/lib/value.ts)

      # report only: broken text on pages, promo logic, untranslated uk/ru titles (warnings on the run, never blocks a deploy)
      - name: Content audit
        run: node scripts/audit-content.mjs
        continue-on-error: true

      # every build: estimates, duplicates, dates, links, texts (→ out/api/quality.json, read hourly by health.mjs);
      # STOPS the deploy only on a mass source outage or a forbidden text coming back — the last good site stays online
      - name: Quality guard
        run: node scripts/quality.mjs

      - name: Friendly 404 (old addresses redirect)
        run: node scripts/page-404.mjs

      - name: Share cards (og:image) for promo pages
        run: node scripts/og-cards.mjs
        continue-on-error: true

      - name: Record APR snapshot
        run: node scripts/snapshot.mjs

      - name: Post to Telegram
        run: node scripts/telegram-post.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://${{ vars.SITE_HOST || format('{0}.github.io/promoradar', github.repository_owner) }}
          POST_LANG: ${{ vars.POST_LANG || 'uk' }}

      - name: Save data branch
        working-directory: data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -d .git ]; then
            git init -q -b data
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          fi
          git config user.name "promoradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data: $(date -u +%FT%TZ)" || exit 0
          git push -q origin HEAD:data

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # 25.11: Bing / Yandex learn about new pages right after each deploy (IndexNow); Google reads the sitemap
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    env:
      SITE_HOST: ${{ vars.SITE_HOST || 'promoradar.xyz' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: scripts
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .indexnow
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-
      - run: node scripts/indexnow.mjs
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always()
        with:
          path: .indexnow
          key: indexnow-${{ github.run_id }}
